<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data:; connect-src 'self' https://hlvcjroskewmoxsxwksg.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'" />
  <script src="../assets/frame-guard.js"></script>
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get The Forge</title>
  <meta name="description" content="Download The Forge, the app that hates being used.">
  <link rel="canonical" href="https://jointheforge.app/get/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://jointheforge.app/get/" />
  <meta property="og:title" content="Get The Forge" />
  <meta property="og:description" content="Download The Forge, the app that hates being used." />
  <meta property="og:image" content="https://jointheforge.app/assets/feature-graphic.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800;900&display=swap" />
  <link rel="stylesheet" href="../fx-core.css" />
  <link rel="modulepreload" href="../assets/three.module.min.js" />
  <script>document.documentElement.classList.add('js');</script>
  <style>
    :root { --gold: #FACC15; --bg: #0A0A0A; --muted: #9CA3AF; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: #fff; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif; padding: 24px;
    }
    .card { max-width: 420px; text-align: center; }
    img.icon { width: 84px; height: 84px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-family: 'Anton', system-ui, sans-serif; font-size: clamp(40px, 11vw, 60px); font-weight: 400; line-height: .95; letter-spacing: -.5px; text-transform: uppercase; margin-bottom: 12px; }
    .forge3d { max-width: 260px; margin: -30px auto -20px; }
    .btn { border-radius: 10px; transition: transform .35s cubic-bezier(.87,0,.13,1), box-shadow .35s; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 44px rgba(245,158,11,.32); }
    .ref { border-radius: 10px; }
    p { color: var(--muted); font-size: 15px; line-height: 1.5; margin-bottom: 26px; }
    .btn {
      display: block; background: var(--gold); color: #000; text-decoration: none;
      font-weight: 900; letter-spacing: 2px; font-size: 14px; padding: 16px 20px; margin-bottom: 12px;
    }
    .btn.ghost { background: transparent; color: var(--gold); border: 2px solid var(--gold); }
    .ref {
      margin-top: 22px; border: 1px dashed #333; padding: 12px; font-size: 13px; color: var(--muted);
    }
    .ref b { color: var(--gold); letter-spacing: 2px; font-size: 16px; display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="fx-backdrop" aria-hidden="true"></div>
  <div class="card">
    <div class="forge3d" aria-hidden="true">
      <canvas></canvas>
      <img class="fallback" src="../assets/app-icon.png" alt="" />
    </div>
    <h1 class="split">Get <span class="gold">The Forge</span></h1>
    <p class="fx-in fx-d1">The app that hates being used. Discipline, made real.</p>

    <!-- Every in-app share links here, so where people land is decided on the
         website, never in an app build. During the beta: iPhone goes to the
         public TestFlight link; Android goes to Google Play (open testing from
         2026-10-27, so the listing is public and the install referrer carries
         the invite code). At public launch, set the App Store URL. -->
    <a class="btn" id="androidBtn" data-store="https://play.google.com/store/apps/details?id=com.theforge.app" href="https://play.google.com/apps/testing/com.theforge.app">Android: join the beta on Google Play</a>
    <a class="btn ghost" id="iosBtn" data-store="https://testflight.apple.com/join/Myg3b4HA" href="../">iPhone: join the beta on TestFlight</a>

    <div class="ref" id="refBox" hidden>
      Your invite code, enter it during onboarding:
      <b id="refCode"></b>
    </div>
  </div>

  <script>
    (function () {
      // LIVE flags: flip to true when each store listing is public.
      var ANDROID_LIVE = false;   // true once the Play store listing page is public (it 404ed right after open testing went live)
      var IOS_LIVE = true;        // iOS target live? (TestFlight public beta now)

      var params = new URLSearchParams(location.search);
      var ref = (params.get('ref') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      if (ref) {
        document.getElementById('refBox').hidden = false;
        document.getElementById('refCode').textContent = ref;
      }

      var androidBtn = document.getElementById('androidBtn');
      var iosBtn = document.getElementById('iosBtn');

      if (ANDROID_LIVE) {
        var playUrl = androidBtn.getAttribute('data-store');
        // Play Install Referrer keeps the invite code through install.
        if (ref) playUrl += '&referrer=' + encodeURIComponent('ref=' + ref);
        androidBtn.href = playUrl;
        androidBtn.textContent = 'Get it on Google Play';
      } else {
        // Beta: the waitlist signup carries the invite code into ref_code.
        // Open testing: Google's join page works for any Google account.
        androidBtn.href = 'https://play.google.com/apps/testing/com.theforge.app';
        androidBtn.textContent = 'Android: join the beta on Google Play';
      }
      if (IOS_LIVE && iosBtn.getAttribute('data-store')) {
        iosBtn.href = iosBtn.getAttribute('data-store');
      }

      // Auto-forward when we can tell the platform AND that store is live.
      var ua = navigator.userAgent || '';
      if (ANDROID_LIVE && /Android/i.test(ua)) location.replace(androidBtn.href);
      // With an invite code, stay so they can see and copy it (TestFlight has no
      // install referrer to carry it for them).
      else if (IOS_LIVE && !ref && /iPhone|iPad|iPod/i.test(ua)) location.replace(iosBtn.href);
    })();
  </script>
  <script src="../assets/fx.js"></script>
  <script type="module" src="../assets/hero3d.js"></script>
  <script src="../track.js" defer></script>
</body>
</html>
